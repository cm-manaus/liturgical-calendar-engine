services:
  liturgical-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/cm-manaus/tesouro-backend:latest
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Security hardening settings
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # Cloudflare Tunnel Agent
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # Automated lightweight CD agent (monitors and auto-updates liturgical-backend)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower-tesouro
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/matheus/.docker/config.json:/config.json:ro
      - /home/matheus/.docker/config.json:/root/.docker/config.json:ro
    environment:
      - DOCKER_CONFIG=/
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M
